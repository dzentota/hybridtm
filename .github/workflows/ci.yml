name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ', lowest deps' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        dependencies: ['highest']
        include:
          - php: '8.2'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: composer test

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: PHPStan (level 8)
        run: composer stan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: PHP-CS-Fixer
        run: composer cs
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

  compile-example:
    name: Compile the bundled example end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3

      - name: Compile example threat model
        run: |
          mkdir -p build
          php bin/hybridtm compile \
            --infra=example/threat-model.php \
            --source=example/src/ \
            --out=build/threagile.yaml

      - name: Fail if the generated YAML is empty
        run: test -s build/threagile.yaml

      - name: Verify Threagile accepts the generated model
        run: |
          mkdir -p build/threagile-output
          docker run --rm --network=none \
            -v "${{ github.workspace }}/build:/work" \
            threagile/threagile:latest \
            --model /work/threagile.yaml \
            --output /work/threagile-output
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threagile-output
          path: build/
          retention-days: 7

  dogfood:
    name: Dogfooding — analyze the platform's own threat model
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Analyze threat-model.php (T-11.7)
        run: php bin/hybridtm analyze --infra=threat-model.php --kb=apps/api/kb --format=table --fail-on=critical
      - name: Export SARIF for code scanning
        run: php bin/hybridtm analyze --infra=threat-model.php --kb=apps/api/kb --format=sarif > hybridtm-self-analysis.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hybridtm-self-analysis.sarif

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Audit dependencies
        run: composer audit --abandoned=report
