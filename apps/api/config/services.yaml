# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where deep-analysis Threagile runs write their input YAML/output
    # risks.json — must exist and be writable (Threagile does not create it).
    threagile_work_dir: '%kernel.project_dir%/var/threagile'

    # KB package directories, later paths overriding earlier ones
    # (YamlKbLoader's own layering convention) — a dev seed for now; a real
    # deployment points this at kb-core/kb-aws/... once those packages
    # exist (E8), plus an org-specific overrides directory last.
    kb_paths:
        - '%kernel.project_dir%/kb'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $threagileWorkDir: '%threagile_work_dir%'
            array $kbPaths: '%kb_paths%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # HybridTM library services. Not autowired via App\ (they live in the
    # hybridtm/hybridtm package), and not everything the library exposes
    # has a matching interface binding — these are exactly what this app's
    # controllers/handlers currently need.
    # Constructed once and reused across requests — RuleEngine caches parsed
    # rule expressions internally, so re-creating it per-request would throw
    # that cache away every time.
    HybridTM\Analysis\RuleEngine: ~

    HybridTM\Codec\ModelJsonCodec: ~
    HybridTM\Codec\PhpDslWriter: ~
    HybridTM\Codec\LayoutCodec: ~
    HybridTM\Codec\OtmCodec: ~
    HybridTM\Codec\ModelMerger: ~
    HybridTM\Yaml\ThreagileSerializer: ~
    HybridTM\Threagile\ThreagileRiskParser: ~
    HybridTM\Threagile\ThreagileCategoryMap: ~
    HybridTM\Threagile\ThreagileMerger: ~
    HybridTM\Risk\ExpiredAcceptanceReverter: ~

    # Deep analysis never shells out to Docker/a Threagile binary unless a
    # deployment explicitly opts in — NullThreagileRunner is the safe
    # default (an empty risks.json, i.e. "Threagile found nothing new").
    # Override this alias in config/services_*.yaml to point at
    # DockerThreagileRunner/BinaryThreagileRunner for a real deployment.
    HybridTM\Threagile\ThreagileRunnerInterface: '@HybridTM\Threagile\NullThreagileRunner'
    HybridTM\Threagile\NullThreagileRunner: ~

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
