apiVersion: hybridtm.io/kb/v1
kind: Template
metadata:
  id: api-gateway-microservices
  name: API gateway + microservices
spec:
  description: 'Gateway fanning out to two independent services over Kafka, each with its own datastore.'
  graph:
    components:
      - { id: browser, type: client-browser-spa, x: 0, y: 120 }
      - { id: gateway, type: api-gateway-generic, x: 260, y: 120 }
      - { id: svc_a, type: app-server-nodejs, x: 520, y: 40 }
      - { id: svc_b, type: app-server-symfony, x: 520, y: 200 }
      - { id: kafka, type: queue-kafka, x: 780, y: 120 }
      - { id: db_a, type: db-mongodb, x: 1040, y: 40 }
      - { id: db_b, type: db-mysql, x: 1040, y: 200 }
    flows:
      - { source: browser, target: gateway, protocol: https }
      - { source: gateway, target: svc_a, protocol: https }
      - { source: gateway, target: svc_b, protocol: https }
      - { source: svc_a, target: kafka, protocol: binary-encrypted }
      - { source: svc_b, target: kafka, protocol: binary-encrypted }
      - { source: svc_a, target: db_a, protocol: nosql-access-protocol-encrypted }
      - { source: svc_b, target: db_b, protocol: sql-access-protocol-encrypted }
