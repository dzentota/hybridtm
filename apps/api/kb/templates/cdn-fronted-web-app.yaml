apiVersion: hybridtm.io/kb/v1
kind: Template
metadata:
  id: cdn-fronted-web-app
  name: CDN-fronted web app
spec:
  description: 'Adds a CDN/WAF in front of the classic web app for public internet exposure.'
  graph:
    components:
      - { id: browser, type: client-browser-spa, x: 0, y: 80 }
      - { id: cdn, type: cdn-waf-cloudflare, x: 260, y: 80 }
      - { id: nginx, type: web-server-nginx, x: 520, y: 80 }
      - { id: app, type: app-server-symfony, x: 780, y: 80 }
      - { id: db, type: db-postgresql, x: 1040, y: 80 }
    flows:
      - { source: browser, target: cdn, protocol: https }
      - { source: cdn, target: nginx, protocol: https }
      - { source: nginx, target: app, protocol: http }
      - { source: app, target: db, protocol: jdbc-encrypted }
