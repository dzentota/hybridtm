apiVersion: hybridtm.io/kb/v1
kind: Template
metadata:
  id: classic-web-app
  name: Classic web app
spec:
  description: 'Browser through Nginx to a Symfony app server, backed by Postgres with a Redis cache.'
  graph:
    components:
      - { id: browser, type: client-browser-spa, x: 0, y: 80 }
      - { id: nginx, type: web-server-nginx, x: 260, y: 80 }
      - { id: app, type: app-server-symfony, x: 520, y: 80 }
      - { id: db, type: db-postgresql, x: 780, y: 0 }
      - { id: cache, type: cache-redis, x: 780, y: 160 }
    flows:
      - { source: browser, target: nginx, protocol: https }
      - { source: nginx, target: app, protocol: http }
      - { source: app, target: db, protocol: jdbc-encrypted }
      - { source: app, target: cache, protocol: binary-encrypted }
