apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: web/http-trace-enabled
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Web server accepts the HTTP TRACE method.'
  when:
    all:
      - "component.hasTrait('http_server')"
      - "component.props.bool('trace_method_enabled') == true"
  then:
    - raise: THREAT-HTTP-TRACE-ENABLED
      evidence: "{{ component.name }} accepts HTTP TRACE requests."
      require: [CM-DISABLE-TRACE-METHOD]
    - suggest_fix:
        set: { trace_method_enabled: false }
        label: 'Disable the TRACE method'
