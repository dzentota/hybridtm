apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/cors-wildcard-origin
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Application runtime allows CORS requests from any origin.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('cors_restricted') == false"
  then:
    - raise: THREAT-CORS-WILDCARD-ORIGIN
      evidence: "{{ component.name }} does not restrict CORS to an explicit origin allow-list."
      require: [CM-RESTRICT-CORS-ORIGIN]
    - suggest_fix:
        set: { cors_restricted: true }
        label: 'Restrict CORS to an origin allow-list'
