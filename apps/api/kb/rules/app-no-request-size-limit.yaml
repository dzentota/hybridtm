apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/no-request-size-limit
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Application runtime enforces no maximum request size.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('request_size_limit_enforced') == false"
  then:
    - raise: THREAT-NO-REQUEST-SIZE-LIMIT
      evidence: "{{ component.name }} enforces no maximum request size."
      require: [CM-ENFORCE-REQUEST-SIZE-LIMIT]
    - suggest_fix:
        set: { request_size_limit_enforced: true }
        label: 'Enforce a maximum request size'
