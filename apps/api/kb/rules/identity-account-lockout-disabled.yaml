apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/account-lockout-disabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Identity provider does not lock out accounts after repeated failed logins.'
  when:
    all:
      - "component.hasTrait('identity_provider')"
      - "component.props.bool('account_lockout_enabled') == false"
  then:
    - raise: THREAT-BRUTE-FORCE-NO-LOCKOUT
      evidence: "{{ component.name }} does not lock out accounts after failed logins."
      require: [CM-ENABLE-ACCOUNT-LOCKOUT]
    - suggest_fix:
        set: { account_lockout_enabled: true }
        label: 'Enable account lockout'
