apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: iot/firmware-unsigned
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'IoT device does not verify firmware update signatures.'
  when:
    all:
      - "component.hasTrait('iot_device')"
      - "component.props.bool('firmware_signature_verified') == false"
  then:
    - raise: THREAT-IOT-FIRMWARE-UNSIGNED
      evidence: "{{ component.name }} does not verify firmware signatures."
      require: [CM-VERIFY-FIRMWARE-SIGNATURE]
    - suggest_fix:
        set: { firmware_signature_verified: true }
        label: 'Verify firmware signatures'
