apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/datastore-no-backups
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Datastore has no automated backups.'
  when:
    all:
      - "component.hasTrait('datastore')"
      - "component.props.bool('automated_backups_enabled') == false"
  then:
    - raise: THREAT-DATASTORE-NO-BACKUPS
      evidence: "{{ component.name }} has no automated backups."
      require: [CM-ENABLE-AUTOMATED-BACKUPS]
    - suggest_fix:
        set: { automated_backups_enabled: true }
        label: 'Enable automated backups'
