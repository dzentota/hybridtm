apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: integration/no-dead-letter-queue
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Message queue has no dead-letter queue for repeatedly-failing messages.'
  when:
    all:
      - "component.hasTrait('message_broker')"
      - "component.props.bool('dead_letter_queue_configured') == false"
  then:
    - raise: THREAT-NO-DEAD-LETTER-QUEUE
      evidence: "{{ component.name }} has no dead-letter queue configured."
      require: [CM-CONFIGURE-DEAD-LETTER-QUEUE]
    - suggest_fix:
        set: { dead_letter_queue_configured: true }
        label: 'Configure a dead-letter queue'
