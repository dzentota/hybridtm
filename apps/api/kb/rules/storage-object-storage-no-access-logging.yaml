apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/object-storage-no-access-logging
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Object storage access is not logged.'
  when:
    all:
      - "component.hasTrait('object_storage')"
      - "component.props.bool('access_logging_enabled') == false"
  then:
    - raise: THREAT-OBJECT-STORAGE-NO-ACCESS-LOGGING
      evidence: "{{ component.name }} does not log access."
      require: [CM-ENABLE-OBJECT-ACCESS-LOGGING]
    - suggest_fix:
        set: { access_logging_enabled: true }
        label: 'Enable access logging'
