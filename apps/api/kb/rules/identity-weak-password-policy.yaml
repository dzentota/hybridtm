apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/weak-password-policy
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Identity provider does not enforce a minimum password policy.'
  when:
    all:
      - "component.hasTrait('identity_provider')"
      - "component.props.bool('password_policy_enforced') == false"
  then:
    - raise: THREAT-WEAK-PASSWORD-POLICY
      evidence: "{{ component.name }} does not enforce a minimum password policy."
      require: [CM-ENFORCE-PASSWORD-POLICY]
    - suggest_fix:
        set: { password_policy_enforced: true }
        label: 'Enforce a minimum password policy'
