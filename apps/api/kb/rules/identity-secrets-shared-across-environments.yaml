apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/secrets-shared-across-environments
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Secrets store reuses the same secrets across production and non-production environments.'
  when:
    all:
      - "component.hasTrait('secrets_manager')"
      - "component.props.bool('secrets_shared_across_environments') == true"
  then:
    - raise: THREAT-SECRETS-SHARED-ACROSS-ENVS
      evidence: "{{ component.name }} reuses the same secrets across environments."
      require: [CM-SEPARATE-SECRETS-PER-ENVIRONMENT]
    - suggest_fix:
        set: { secrets_shared_across_environments: false }
        label: 'Use separate secrets per environment'
