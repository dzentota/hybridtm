apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/secrets-no-lease-ttl
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Secrets store issues credentials with no bounded lease/TTL.'
  when:
    all:
      - "component.hasTrait('secrets_manager')"
      - "component.props.bool('lease_ttl_enforced') == false"
  then:
    - raise: THREAT-SECRETS-NO-EXPIRATION
      evidence: "{{ component.name }} issues secrets with no enforced lease/TTL."
      require: [CM-ENFORCE-LEASE-TTL]
    - suggest_fix:
        set: { lease_ttl_enforced: true }
        label: 'Enforce a lease TTL on issued secrets'
