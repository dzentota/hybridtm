apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: cicd/no-secret-scanning
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'CI/CD pipeline does not scan commits/history for secrets.'
  when:
    all:
      - "component.hasTrait('cicd_pipeline')"
      - "component.props.bool('secret_scanning_enabled') == false"
  then:
    - raise: THREAT-NO-SECRET-SCANNING
      evidence: "{{ component.name }} does not scan commits for secrets."
      require: [CM-ENABLE-SECRET-SCANNING]
    - suggest_fix:
        set: { secret_scanning_enabled: true }
        label: 'Enable secret scanning'
