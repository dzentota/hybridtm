apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: integration/queue-unencrypted-at-rest
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Message queue persists messages to disk without encryption at rest.'
  when:
    all:
      - "component.hasTrait('message_broker')"
      - "component.props.bool('encryption_at_rest') == false"
  then:
    - raise: THREAT-DATA-AT-REST-UNENCRYPTED
      evidence: "{{ component.name }} persists messages without encryption at rest."
      require: [CM-ENCRYPT-AT-REST]
    - suggest_fix:
        set: { encryption_at_rest: true }
        label: 'Enable encryption at rest'
