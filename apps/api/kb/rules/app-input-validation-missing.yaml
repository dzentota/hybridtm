apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/input-validation-missing
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Application runtime does not validate untrusted input.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('input_validation') == false"
  then:
    - raise: THREAT-INPUT-VALIDATION-MISSING
      evidence: "{{ component.name }} does not validate input."
      require: [CM-INPUT-VALIDATION]
