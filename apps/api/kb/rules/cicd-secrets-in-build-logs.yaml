apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: cicd/secrets-in-build-logs
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'CI/CD pipeline has no protection against secrets leaking into build logs.'
  when:
    all:
      - "component.hasTrait('cicd_pipeline')"
      - "component.props.bool('secrets_in_logs_prevented') == false"
  then:
    - raise: THREAT-SENSITIVE-DATA-IN-LOGS
      evidence: "{{ component.name }} does not scrub secrets from build output."
      require: [CM-SCRUB-SENSITIVE-DATA]
    - suggest_fix:
        set: { secrets_in_logs_prevented: true }
        label: 'Enable build-log secret scrubbing'
