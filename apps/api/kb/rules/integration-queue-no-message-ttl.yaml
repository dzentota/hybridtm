apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: integration/queue-no-message-ttl
  version: 1.0.0
  priority: 10
spec:
  scope: component
  description: 'Message queue retains messages with no expiration.'
  when:
    all:
      - "component.hasTrait('message_broker')"
      - "component.props.bool('message_ttl_configured') == false"
  then:
    - raise: THREAT-QUEUE-NO-MESSAGE-TTL
      evidence: "{{ component.name }} has no message expiration configured."
      require: [CM-CONFIGURE-MESSAGE-TTL]
    - suggest_fix:
        set: { message_ttl_configured: true }
        label: 'Configure message TTL'
