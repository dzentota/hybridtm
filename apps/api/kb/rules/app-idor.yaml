apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/idor
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Application does not check object-level authorization on identifier-based access.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('object_level_authorization_enforced') == false"
  then:
    - raise: THREAT-IDOR
      evidence: "{{ component.name }} does not enforce object-level authorization."
      require: [CM-ENFORCE-OBJECT-LEVEL-AUTHORIZATION]
    - suggest_fix:
        set: { object_level_authorization_enforced: true }
        label: 'Enforce object-level authorization'
