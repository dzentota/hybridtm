apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: registry/artifacts-not-retained
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Artifact registry has no retention policy for published artifacts.'
  when:
    all:
      - "component.hasTrait('artifact_registry')"
      - "component.props.bool('retention_policy_configured') == false"
  then:
    - raise: THREAT-ARTIFACTS-NOT-RETAINED
      evidence: "{{ component.name }} has no retention policy for published artifacts."
      require: [CM-RETAIN-ARTIFACTS]
    - suggest_fix:
        set: { retention_policy_configured: true }
        label: 'Configure artifact retention'
