apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: observability/no-alerting-configured
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Observability collector has no alerting configured on collected telemetry.'
  when:
    all:
      - "component.hasTrait('observability_collector')"
      - "component.props.bool('alerting_configured') == false"
  then:
    - raise: THREAT-NO-ALERTING-CONFIGURED
      evidence: "{{ component.name }} has no alerting configured."
      require: [CM-CONFIGURE-ALERTING]
    - suggest_fix:
        set: { alerting_configured: true }
        label: 'Configure alerting'
