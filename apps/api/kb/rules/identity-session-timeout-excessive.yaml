apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/session-timeout-excessive
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Identity provider session idle timeout exceeds 8 hours.'
  when:
    all:
      - "component.hasTrait('identity_provider')"
      - "component.props.int('session_timeout_minutes') > 480"
  then:
    - raise: THREAT-SESSION-TIMEOUT-EXCESSIVE
      evidence: "{{ component.name }} allows sessions to stay idle for {{ component.props.int('session_timeout_minutes') }} minutes."
      require: [CM-ENFORCE-SESSION-TIMEOUT]
    - suggest_fix:
        set: { session_timeout_minutes: 30 }
        label: 'Reduce session timeout to 30 minutes'
