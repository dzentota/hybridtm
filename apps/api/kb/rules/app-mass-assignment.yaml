apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/mass-assignment
  version: 1.0.0
  priority: 10
spec:
  scope: component
  description: 'Application binds request fields directly to internal model attributes with no allow-list.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('mass_assignment_protected') == false"
  then:
    - raise: THREAT-MASS-ASSIGNMENT
      evidence: "{{ component.name }} does not use an explicit field allow-list for request binding."
      require: [CM-PREVENT-MASS-ASSIGNMENT]
    - suggest_fix:
        set: { mass_assignment_protected: true }
        label: 'Use an explicit field allow-list'
