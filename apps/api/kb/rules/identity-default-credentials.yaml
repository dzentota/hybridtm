apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/default-credentials
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Identity infrastructure still uses default administrative credentials.'
  when:
    all:
      - "component.hasTrait('identity_provider')"
      - "component.props.bool('default_admin_credentials_changed') == false"
  then:
    - raise: THREAT-DEFAULT-CREDENTIALS
      evidence: "{{ component.name }} may still use default administrative credentials."
      require: [CM-ROTATE-DEFAULT-CREDENTIALS]
    - suggest_fix:
        set: { default_admin_credentials_changed: true }
        label: 'Mark default credentials as rotated'
