apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: web/weak-cipher-suites
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Web server allows weak or non-forward-secret TLS cipher suites.'
  when:
    all:
      - "component.hasTrait('http_server')"
      - "component.props.bool('weak_ciphers_disabled') == false"
  then:
    - raise: THREAT-WEAK-CIPHER-SUITES
      evidence: "{{ component.name }} allows weak TLS cipher suites."
      require: [CM-DISABLE-WEAK-CIPHERS]
    - suggest_fix:
        set: { weak_ciphers_disabled: true }
        label: 'Disable weak cipher suites'
