apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: payment/scope-not-isolated
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Payment integration is not isolated into its own PCI DSS scope.'
  when:
    all:
      - "component.hasTrait('payment_processor')"
      - "component.props.bool('pci_scope_isolated') == false"
  then:
    - raise: THREAT-PAYMENT-DATA-NOT-ISOLATED
      evidence: "{{ component.name }} is not isolated into its own PCI scope."
      require: [CM-ISOLATE-PCI-SCOPE]
    - suggest_fix:
        set: { pci_scope_isolated: true }
        label: 'Isolate payment processing into its own boundary'
