apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/secrets-rotation-disabled
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Secrets store does not rotate secrets automatically.'
  when:
    all:
      - "component.hasTrait('secrets_manager')"
      - "component.props.bool('rotation_enabled') == false"
  then:
    - raise: THREAT-SECRETS-NOT-ROTATED
      evidence: "{{ component.name }} does not rotate secrets automatically."
      require: [CM-ENABLE-SECRET-ROTATION]
    - suggest_fix:
        set: { rotation_enabled: true }
        label: 'Enable automatic secret rotation'
