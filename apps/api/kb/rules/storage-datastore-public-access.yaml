apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/datastore-public-access
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Datastore reachable from a public network.'
  when:
    all:
      - "component.hasTrait('datastore')"
      - "component.props.bool('public_network_access') == true"
  then:
    - raise: THREAT-DATASTORE-PUBLIC-ACCESS
      evidence: "{{ component.name }} is reachable from a public network."
      require: [CM-RESTRICT-DB-NETWORK-ACCESS]
    - suggest_fix:
        set: { public_network_access: false }
        label: 'Restrict to a private network'
