apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: payment/card-data-not-tokenized
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Payment integration handles raw card data instead of a provider token.'
  when:
    all:
      - "component.hasTrait('payment_processor')"
      - "component.props.bool('tokenization_enabled') == false"
  then:
    - raise: THREAT-CARD-DATA-NOT-TOKENIZED
      evidence: "{{ component.name }} does not use provider tokenization."
      require: [CM-TOKENIZE-CARD-DATA]
    - suggest_fix:
        set: { tokenization_enabled: true }
        label: 'Enable provider tokenization'
