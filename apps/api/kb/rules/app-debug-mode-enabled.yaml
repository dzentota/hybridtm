apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/debug-mode-enabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Application runtime has debug/verbose error mode enabled.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('debug_mode') == true"
  then:
    - raise: THREAT-DEBUG-MODE-ENABLED
      evidence: "{{ component.name }} has debug mode enabled."
      require: [CM-DISABLE-DEBUG-MODE]
    - suggest_fix:
        set: { debug_mode: false }
        label: 'Disable debug mode'
