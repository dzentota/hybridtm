apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/object-storage-public-read
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Object storage bucket readable without authentication.'
  when:
    all:
      - "component.hasTrait('object_storage')"
      - "component.props.bool('public_read_access') == true"
  then:
    - raise: THREAT-OBJECT-STORAGE-PUBLIC-READ
      evidence: "{{ component.name }} allows public read access."
      require: [CM-BLOCK-PUBLIC-BUCKET-ACCESS]
    - suggest_fix:
        set: { public_read_access: false }
        label: 'Block public read access'
