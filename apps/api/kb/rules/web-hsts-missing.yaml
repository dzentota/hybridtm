apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: web/hsts-missing
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'TLS-terminating component without HSTS enabled.'
  when:
    all:
      - "component.hasTrait('tls_terminator')"
      - "component.props.bool('tls_terminated') == true"
      - "component.props.bool('hsts_enabled') == false"
  then:
    - raise: THREAT-HSTS-MISSING
      evidence: "{{ component.name }} terminates TLS without sending Strict-Transport-Security."
    - suggest_fix:
        set: { hsts_enabled: true }
        label: 'Enable HSTS'
