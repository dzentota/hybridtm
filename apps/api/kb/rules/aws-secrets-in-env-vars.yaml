apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: aws/secrets-in-env-vars
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Compute resource stores secrets as plaintext environment variables instead of fetching them from a secrets manager.'
  when:
    all:
      - "component.hasTrait('aws_compute')"
      - "component.props.bool('secrets_via_secrets_manager') == false"
  then:
    - raise: THREAT-SECRETS-IN-ENV-VARS
      evidence: "{{ component.name }} does not fetch secrets from a secrets manager."
      require: [CM-USE-SECRETS-MANAGER-FOR-ENV]
    - suggest_fix:
        set: { secrets_via_secrets_manager: true }
        label: 'Fetch secrets from a secrets manager'
