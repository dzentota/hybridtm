apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/dependency-audit-disabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: "Application runtime's dependencies are not scanned for known vulnerabilities."
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('dependency_audit_enabled') == false"
  then:
    - raise: THREAT-VULNERABLE-DEPENDENCIES
      evidence: "{{ component.name }} has no dependency vulnerability scanning."
      require: [CM-DEPENDENCY-SCANNING]
