apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/secrets-root-token-active
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: "Secrets store's initial root/superuser token has not been revoked."
  when:
    all:
      - "component.hasTrait('secrets_manager')"
      - "component.props.bool('root_token_revoked') == false"
  then:
    - raise: THREAT-SECRETS-ROOT-TOKEN-ACTIVE
      evidence: "{{ component.name }}'s initial root token has not been revoked."
      require: [CM-REVOKE-ROOT-TOKEN]
    - suggest_fix:
        set: { root_token_revoked: true }
        label: 'Mark root token as revoked'
