apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: registry/artifacts-unsigned
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Artifact registry does not sign artifacts or verify signatures.'
  when:
    all:
      - "component.hasTrait('artifact_registry')"
      - "component.props.bool('artifact_signing_enabled') == false"
  then:
    - raise: THREAT-UNSIGNED-ARTIFACTS
      evidence: "{{ component.name }} does not sign or verify artifact signatures."
      require: [CM-SIGN-ARTIFACTS]
    - suggest_fix:
        set: { artifact_signing_enabled: true }
        label: 'Enable artifact signing'
