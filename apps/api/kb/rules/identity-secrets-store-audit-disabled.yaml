apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: identity/secrets-store-audit-disabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Secrets store access is not audit-logged.'
  when:
    all:
      - "component.hasTrait('secrets_manager')"
      - "component.props.bool('audit_logging_enabled') == false"
  then:
    - raise: THREAT-SECRETS-AUDIT-DISABLED
      evidence: "{{ component.name }} does not audit-log secret access."
      require: [CM-ENABLE-AUDIT-LOGGING]
    - suggest_fix:
        set: { audit_logging_enabled: true }
        label: 'Enable audit logging'
