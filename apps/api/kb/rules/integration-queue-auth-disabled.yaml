apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: integration/queue-auth-disabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Message broker accepts unauthenticated producers/consumers.'
  when:
    all:
      - "component.hasTrait('message_broker')"
      - "component.props.bool('auth_required') == false"
  then:
    - raise: THREAT-QUEUE-NO-AUTH
      evidence: "{{ component.name }} does not require producer/consumer authentication."
      require: [CM-QUEUE-AUTHENTICATION]
    - suggest_fix:
        set: { auth_required: true }
        label: 'Require broker authentication'
