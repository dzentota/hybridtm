apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: web/session-cookie-insecure
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: "Application runtime's session cookie is missing Secure/HttpOnly attributes."
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('session_cookie_secure') == false"
  then:
    - raise: THREAT-SESSION-COOKIE-INSECURE
      evidence: "{{ component.name }}'s session cookie is not marked Secure/HttpOnly."
      require: [CM-SECURE-SESSION-COOKIES]
    - suggest_fix:
        set: { session_cookie_secure: true }
        label: 'Secure the session cookie'
