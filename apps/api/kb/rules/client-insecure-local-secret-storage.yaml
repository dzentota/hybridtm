apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: client/insecure-local-secret-storage
  version: 1.0.0
  priority: 40
spec:
  scope: component
  description: 'Client does not store secrets in the platform secure storage.'
  when:
    all:
      - "component.hasTrait('client_device')"
      - "component.props.bool('local_secret_storage_secure') == false"
  then:
    - raise: THREAT-INSECURE-LOCAL-SECRET-STORAGE
      evidence: "{{ component.name }} does not use platform-secure storage for secrets."
      require: [CM-SECURE-LOCAL-STORAGE]
    - suggest_fix:
        set: { local_secret_storage_secure: true }
        label: 'Use platform keychain/keystore'
