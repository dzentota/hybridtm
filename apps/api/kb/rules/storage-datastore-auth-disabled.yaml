apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/datastore-auth-disabled
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Datastore reachable without client authentication.'
  when:
    all:
      - "component.hasTrait('datastore')"
      - "component.props.bool('auth_required') == false"
  then:
    - raise: THREAT-DATASTORE-NO-AUTH
      evidence: "{{ component.name }} does not require client authentication."
      require: [CM-REQUIRE-DATASTORE-AUTH]
    - suggest_fix:
        set: { auth_required: true }
        label: 'Require authentication'
