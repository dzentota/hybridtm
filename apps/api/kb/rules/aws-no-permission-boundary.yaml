apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: aws/no-permission-boundary
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Compute resource IAM role has no permission boundary.'
  when:
    all:
      - "component.hasTrait('aws_compute')"
      - "component.props.bool('permission_boundary_configured') == false"
  then:
    - raise: THREAT-IAM-NO-PERMISSION-BOUNDARY
      evidence: "{{ component.name }}'s role has no permission boundary."
      require: [CM-SET-PERMISSION-BOUNDARY]
    - suggest_fix:
        set: { permission_boundary_configured: true }
        label: 'Attach a permission boundary'
