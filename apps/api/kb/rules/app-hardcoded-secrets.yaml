apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: app/hardcoded-secrets
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Application has hardcoded credentials in source code instead of externalized configuration.'
  when:
    all:
      - "component.hasTrait('app_runtime')"
      - "component.props.bool('secrets_externalized') == false"
  then:
    - raise: THREAT-HARDCODED-SECRETS
      evidence: "{{ component.name }} does not externalize credentials."
      require: [CM-EXTERNALIZE-SECRETS]
    - suggest_fix:
        set: { secrets_externalized: true }
        label: 'Externalize credentials'
