apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: dns/no-caa-record
  version: 1.0.0
  priority: 10
spec:
  scope: component
  description: 'DNS zone has no CAA record restricting certificate issuance.'
  when:
    all:
      - "component.hasTrait('dns_authoritative')"
      - "component.props.bool('caa_record_configured') == false"
  then:
    - raise: THREAT-NO-CAA-RECORD
      evidence: "{{ component.name }}'s zone has no CAA record."
      require: [CM-CONFIGURE-CAA-RECORD]
    - suggest_fix:
        set: { caa_record_configured: true }
        label: 'Configure a CAA record'
