apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: dns/dnssec-disabled
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'DNS zone is not signed with DNSSEC.'
  when:
    all:
      - "component.hasTrait('dns_authoritative')"
      - "component.props.bool('dnssec_enabled') == false"
  then:
    - raise: THREAT-DNSSEC-DISABLED
      evidence: "{{ component.name }}'s zone is not signed with DNSSEC."
      require: [CM-ENABLE-DNSSEC]
    - suggest_fix:
        set: { dnssec_enabled: true }
        label: 'Enable DNSSEC'
