apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: storage/object-storage-versioning-disabled
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Object storage has versioning disabled.'
  when:
    all:
      - "component.hasTrait('object_storage')"
      - "component.props.bool('versioning_enabled') == false"
  then:
    - raise: THREAT-OBJECT-STORAGE-VERSIONING-DISABLED
      evidence: "{{ component.name }} has versioning disabled."
      require: [CM-ENABLE-OBJECT-VERSIONING]
    - suggest_fix:
        set: { versioning_enabled: true }
        label: 'Enable object versioning'
