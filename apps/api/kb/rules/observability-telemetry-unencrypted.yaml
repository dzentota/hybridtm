apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: observability/telemetry-unencrypted
  version: 1.0.0
  priority: 50
spec:
  scope: component
  description: 'Observability collector ingests telemetry without transport encryption.'
  when:
    all:
      - "component.hasTrait('observability_collector')"
      - "component.props.bool('encryption_in_transit') == false"
  then:
    - raise: THREAT-TELEMETRY-UNENCRYPTED
      evidence: "{{ component.name }} accepts telemetry over an unencrypted connection."
      require: [CM-ENFORCE-TLS]
    - suggest_fix:
        set: { encryption_in_transit: true }
        label: 'Require encryption in transit'
