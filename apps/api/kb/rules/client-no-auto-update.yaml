apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: client/no-auto-update
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Client has no automatic update mechanism.'
  when:
    all:
      - "component.hasTrait('client_device')"
      - "component.props.bool('auto_update_enabled') == false"
  then:
    - raise: THREAT-CLIENT-NO-AUTO-UPDATE
      evidence: "{{ component.name }} has no automatic update mechanism."
      require: [CM-ENABLE-AUTO-UPDATE]
    - suggest_fix:
        set: { auto_update_enabled: true }
        label: 'Enable automatic updates'
