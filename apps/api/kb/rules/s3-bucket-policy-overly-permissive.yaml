apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: s3/bucket-policy-overly-permissive
  version: 1.0.0
  priority: 20
spec:
  scope: component
  description: 'Bucket policy grants access to a broader principal set than the specific roles/services that need it.'
  when:
    all:
      - "component.hasTrait('s3_bucket')"
      - "component.props.bool('bucket_policy_least_privilege') == false"
  then:
    - raise: THREAT-S3-BUCKET-POLICY-OVERLY-PERMISSIVE
      evidence: "{{ component.name }}'s bucket policy is not scoped to specific principals."
      require: [CM-RESTRICT-BUCKET-POLICY]
    - suggest_fix:
        set: { bucket_policy_least_privilege: true }
        label: 'Scope the bucket policy'
