apiVersion: hybridtm.io/kb/v1
kind: Rule
metadata:
  id: kms/overly-permissive-policy
  version: 1.0.0
  priority: 30
spec:
  scope: component
  description: 'Key policy grants broad decrypt access rather than being scoped to specific principals.'
  when:
    all:
      - "component.hasTrait('encryption_key_manager')"
      - "component.props.bool('key_policy_least_privilege') == false"
  then:
    - raise: THREAT-KMS-OVERLY-PERMISSIVE-POLICY
      evidence: "{{ component.name }}'s key policy is not scoped to specific principals."
      require: [CM-RESTRICT-KEY-POLICY]
    - suggest_fix:
        set: { key_policy_least_privilege: true }
        label: 'Restrict the key policy'
