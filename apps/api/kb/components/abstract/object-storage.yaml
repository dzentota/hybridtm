apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: abstract/object-storage
  name: Abstract Object Storage
  version: 1.0.0
  categories: [storage]
  maturity: stable
  icon: mdi:bucket-outline
  color: '#14b8a6'
  abstract: true
spec:
  extends: abstract/datastore
  mapping:
    type: datastore
    technologies: [file-server]
    machine: serverless
  traits: [object_storage]
  properties:
    - id: public_read_access
      label: 'Publicly readable without authentication'
      type: boolean
      default: false
      group: 'Access control'
    - id: versioning_enabled
      label: 'Object versioning enabled'
      type: boolean
      default: false
      group: 'Hardening'
    - id: access_logging_enabled
      label: 'Access is logged'
      type: boolean
      default: false
      group: 'Monitoring'
  rules:
    - storage/object-storage-public-read
    - storage/object-storage-versioning-disabled
    - storage/object-storage-no-access-logging
