apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: abstract/secrets-store
  name: Abstract Secrets Store
  version: 1.0.0
  categories: [identity]
  maturity: stable
  abstract: true
spec:
  mapping:
    type: process
    technologies: [vault]
    machine: container
    defaults:
      confidentiality: strictly-confidential
      integrity: mission-critical
      availability: critical
  traits: [secrets_manager, admin_interface]
  properties:
    - id: audit_logging_enabled
      label: 'Access is audit-logged'
      type: boolean
      default: false
      group: 'Monitoring'
    - id: root_token_revoked
      label: 'Initial root/superuser token revoked'
      type: boolean
      default: false
      group: 'Access control'
  rules:
    - identity/secrets-store-audit-disabled
    - identity/secrets-root-token-active
