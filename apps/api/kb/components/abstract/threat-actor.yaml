apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: abstract/threat-actor
  name: Abstract Threat Actor
  version: 1.0.0
  categories: [actor]
  maturity: stable
  icon: mdi:incognito
  color: '#dc2626'
  abstract: true
spec:
  mapping:
    type: external-entity
    technologies: [client-system]
    machine: physical
    customDevelopedParts: false
    defaults:
      confidentiality: internal
  traits: [threat_actor]
  properties:
    - id: privilege_level
      label: 'Privilege level this actor holds'
      type: enum
      values: [none, user, admin, system]
      default: none
      group: 'Actor profile'
    - id: intent
      label: 'Motivation'
      type: enum
      values: [financial, espionage, disruption, accidental, unknown]
      default: unknown
      group: 'Actor profile'
    - id: capability
      label: 'Sophistication / resources'
      type: enum
      values: [script_kiddie, advanced, apt, automated]
      default: script_kiddie
      group: 'Actor profile'
  rules: []
