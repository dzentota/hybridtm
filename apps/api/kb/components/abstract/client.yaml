apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: abstract/client
  name: Abstract Client
  version: 1.0.0
  categories: [client]
  maturity: stable
  abstract: true
spec:
  mapping:
    type: external-entity
    technologies: [client-system]
    machine: physical
    customDevelopedParts: false
    defaults:
      confidentiality: internal
  traits: [client_device, processing_end_user_requests]
  properties:
    - id: certificate_pinning_enabled
      label: 'Pins server certificate/public key'
      type: boolean
      default: false
      group: 'Cryptography'
    - id: auto_update_enabled
      label: 'Receives automatic security updates'
      type: boolean
      default: false
      group: 'Hardening'
    - id: local_secret_storage_secure
      label: 'Stores secrets in platform keychain/keystore'
      type: boolean
      default: false
      group: 'Cryptography'
    - id: jailbreak_root_detection_enabled
      label: 'Detects jailbroken/rooted devices'
      type: boolean
      default: false
      group: 'Hardening'
  rules:
    - mobile/certificate-pinning-missing
    - client/no-auto-update
    - client/insecure-local-secret-storage
    - client/no-jailbreak-detection
