apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: cdn-waf-cloudflare
  name: Cloudflare CDN + WAF
  version: 1.0.0
  vendor: Cloudflare
  categories: [web, edge]
  icon: simple-icons:cloudflare
  color: '#F38020'
  maturity: stable
spec:
  extends: abstract/reverse-proxy
  mapping:
    type: process
    technologies: [reverse-proxy, waf]
  traits: [waf]
  properties:
    - id: waf_mode
      label: 'WAF mode'
      type: enum
      values: [off, log, block]
      default: log
      group: 'Hardening'
  rules:
    - web/waf-not-blocking
