apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: aws-s3
  name: AWS S3
  version: 1.0.0
  vendor: Amazon Web Services
  categories: [storage, cloud]
  icon: simple-icons:amazons3
  color: '#569A31'
  maturity: stable
spec:
  extends: abstract/object-storage
  mapping:
    type: datastore
    technologies: [file-server]
  traits: [s3_bucket]
  properties:
    - id: bucket_policy_least_privilege
      label: 'Bucket policy scoped to specific principals'
      type: boolean
      default: false
      group: 'Access control'
  rules:
    - s3/bucket-policy-overly-permissive
