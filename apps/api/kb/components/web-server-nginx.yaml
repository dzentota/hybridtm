apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: web-server-nginx
  name: Nginx
  version: 1.4.0
  vendor: F5 NGINX
  categories: [web, edge, proxy]
  maturity: stable
spec:
  mapping:
    type: process
    technologies: [reverse-proxy, web-server]
    machine: container
  traits: [traffic_forwarding, tls_terminator, http_server]
  properties:
    - { id: internet_facing, label: Accepts internet traffic, type: boolean, default: false }
    - { id: tls_terminated, label: Terminates TLS, type: boolean, default: true }
  rules:
    - web/hsts-missing
