apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: db-postgresql
  name: PostgreSQL
  version: 1.0.0
  vendor: PostgreSQL Global Development Group
  categories: [data, datastore]
  maturity: stable
spec:
  mapping:
    type: datastore
    technologies: [database]
    machine: container
  traits: [datastore, sql_engine]
  properties:
    - { id: encryption_at_rest, label: Encryption at rest enabled, type: boolean, default: false }
  rules:
    - storage/unencrypted-at-rest
