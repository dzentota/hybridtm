apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: waf-generic
  name: Web Application Firewall (generic)
  version: 1.0.0
  categories: [web, edge]
  icon: mdi:shield-lock-outline
  color: '#B91C1C'
  maturity: stable
spec:
  extends: abstract/reverse-proxy
  mapping:
    type: process
    technologies: [waf]
  traits: [waf]
  properties:
    - id: waf_mode
      label: 'WAF mode'
      type: enum
      values: [off, log, block]
      default: log
      group: 'Hardening'
  rules:
    - web/waf-not-blocking
