apiVersion: hybridtm.io/kb/v1
kind: Component
metadata:
  id: secrets-vault
  name: HashiCorp Vault
  version: 1.0.0
  vendor: HashiCorp
  categories: [identity]
  icon: simple-icons:vault
  color: '#FFEC6E'
  maturity: stable
spec:
  extends: abstract/secrets-store
  mapping:
    type: process
    technologies: [vault]
  traits: [vault_sealed]
  properties:
    - id: unseal_keys_split
      label: 'Unseal key split across multiple operators'
      type: boolean
      default: false
      group: 'Access control'
  rules:
    - identity/unseal-keys-not-split
