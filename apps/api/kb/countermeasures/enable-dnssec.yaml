apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-DNSSEC
  version: 1.0.0
spec:
  title: 'Sign the DNS zone with DNSSEC'
  description: 'Enable DNSSEC signing at the registrar/DNS provider so resolvers that support it can cryptographically validate responses for this zone.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
