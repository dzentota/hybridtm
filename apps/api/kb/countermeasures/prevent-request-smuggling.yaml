apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-PREVENT-REQUEST-SMUGGLING
  version: 1.0.0
spec:
  title: 'Harden the proxy against request smuggling'
  description: 'Use HTTP/2 (or HTTP/1.1 with strict Content-Length/Transfer-Encoding validation) end-to-end between proxy and upstream, reject ambiguous requests, and keep both sides on the same up-to-date HTTP parser implementation.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
