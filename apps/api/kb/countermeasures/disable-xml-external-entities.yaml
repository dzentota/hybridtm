apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-DISABLE-XML-EXTERNAL-ENTITIES
  version: 1.0.0
spec:
  title: 'Disable external entity resolution in the XML parser'
  description: 'Configure the XML parser to disable DTD processing and external entity resolution by default (most modern parsers support this as a single flag), rather than relying on input sanitization.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
