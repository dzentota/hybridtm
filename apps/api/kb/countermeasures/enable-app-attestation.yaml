apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-APP-ATTESTATION
  version: 1.0.0
spec:
  title: 'Verify app/device integrity with platform attestation'
  description: 'Integrate a platform attestation service (Play Integrity API, Apple DeviceCheck/App Attest) and reject backend requests that fail attestation, rather than trusting any caller that speaks the API protocol.'
  cost: medium
  effort: medium
  effectiveness: medium
  category: preventive
