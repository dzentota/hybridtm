apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-DEFINE-TRUST-BOUNDARIES
  version: 1.0.0
spec:
  title: 'Model the architecture''s actual network segmentation'
  description: 'Add trust boundaries reflecting the real network segmentation (VPCs, subnets, security groups, on-prem zones) so boundary-crossing rules can actually evaluate exposure instead of running against a flat, unsegmented model.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
