apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-PREVENT-MASS-ASSIGNMENT
  version: 1.0.0
spec:
  title: 'Use an explicit allow-list for bindable fields'
  description: 'Bind requests to dedicated DTOs/input objects that only expose the fields a given endpoint is meant to accept, rather than binding directly to the internal domain model.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
