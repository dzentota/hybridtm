apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ISOLATE-SERVERLESS-VPC
  version: 1.0.0
spec:
  title: 'Run the function inside a restricted VPC'
  description: 'Attach the function to a VPC with security groups/NACLs limiting egress to exactly the endpoints it needs (or use VPC endpoints for AWS services), instead of leaving it with unrestricted network access.'
  cost: low
  effort: medium
  effectiveness: medium
  category: preventive
