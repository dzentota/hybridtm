apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENFORCE-SESSION-TIMEOUT
  version: 1.0.0
spec:
  title: 'Enforce a short idle/absolute session timeout'
  description: 'Configure the identity provider to expire sessions after a short idle period and a bounded absolute lifetime, and require re-authentication for sensitive actions.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
