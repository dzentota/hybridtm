apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENFORCE-PASSWORD-POLICY
  version: 1.0.0
spec:
  title: 'Enforce a minimum password policy with breach checking'
  description: 'Require a minimum length and check new passwords against a known-breached-password list (e.g. Have I Been Pwned''s range API) rather than relying on arbitrary complexity rules.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
