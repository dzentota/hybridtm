metadata:
  id: CM-RESTRICT-ZONE-TRANSFER
  version: 1.0.0
spec:
  title: 'Restrict zone transfers to authorized secondaries'
  description: 'Configure the DNS server to allow AXFR/IXFR only from an explicit allow-list of secondary name servers, and require TSIG authentication for transfers.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
