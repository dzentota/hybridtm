metadata:
  id: CM-SPLIT-UNSEAL-KEYS
  version: 1.0.0
spec:
  title: 'Split the unseal key across multiple operators'
  description: 'Use Shamir''s Secret Sharing (or a cloud KMS auto-unseal mechanism with its own access controls) so no single operator alone can unseal the secrets store.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
