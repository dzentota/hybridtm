apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-SECRET-ROTATION
  version: 1.0.0
spec:
  title: 'Rotate secrets automatically on a schedule'
  description: 'Configure automatic periodic rotation for stored credentials (database passwords, API keys) so a leaked secret has a bounded useful lifetime rather than being valid indefinitely.'
  cost: medium
  effort: medium
  effectiveness: medium
  category: preventive
