apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-AVOID-WILDCARD-IAM
  version: 1.0.0
spec:
  title: 'Enumerate specific IAM actions and resources'
  description: 'Replace wildcard actions/resources in the policy with the specific ARNs and API actions actually required, and add an automated policy linter (e.g. IAM Access Analyzer, cfn-nag) to the deployment pipeline to catch new wildcards.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
