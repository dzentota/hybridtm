apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-USE-HEADER-FOR-CREDENTIALS
  version: 1.0.0
spec:
  title: 'Require credentials in a header, not the URL'
  description: 'Require the API key/token in an Authorization or custom header, and reject requests that pass it as a query parameter — headers are not logged or cached by intermediaries the way full URLs are.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
