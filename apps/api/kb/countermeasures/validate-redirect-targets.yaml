apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-VALIDATE-REDIRECT-TARGETS
  version: 1.0.0
spec:
  title: 'Validate redirect targets against an allow-list'
  description: 'Only redirect to relative paths or a fixed allow-list of destination hosts; if an external redirect target is genuinely needed, use an indirection token that maps to a pre-approved URL rather than trusting the raw parameter.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
