apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-DISABLE-WEAK-CIPHERS
  version: 1.0.0
spec:
  title: 'Restrict TLS to strong, forward-secret cipher suites'
  description: 'Configure the TLS stack to offer only modern AEAD cipher suites with forward secrecy (per current Mozilla SSL Configuration Generator "intermediate" or stricter) and disable RC4/3DES/export/non-PFS suites.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
