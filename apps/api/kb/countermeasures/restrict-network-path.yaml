apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-RESTRICT-NETWORK-PATH
  version: 1.0.0
spec:
  title: 'Restrict the network path across the boundary'
  description: 'Require a VPN, private network peering, or source-IP allow-listing for any link that crosses a trust boundary, so the boundary is enforced at the network layer and not just conceptually on the diagram.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
