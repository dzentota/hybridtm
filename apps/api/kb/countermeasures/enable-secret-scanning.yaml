apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-SECRET-SCANNING
  version: 1.0.0
spec:
  title: 'Scan commits and history for secrets'
  description: 'Enable a secret-scanning tool (e.g. GitHub secret scanning, Gitleaks, TruffleHog) as a pre-commit hook and a CI check, and rotate any secret it finds immediately rather than just removing it from the latest commit.'
  cost: low
  effort: low
  effectiveness: high
  category: detective
