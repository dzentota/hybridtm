apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SCRUB-SENSITIVE-DATA
  version: 1.0.0
spec:
  title: 'Scrub secrets and PII before logging'
  description: 'Configure the logging/telemetry pipeline to redact known secret and PII patterns (tokens, passwords, card numbers) before they leave the process, and add a pre-commit or CI check that fails on obvious credential patterns in build output.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
