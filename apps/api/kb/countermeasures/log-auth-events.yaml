apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-LOG-AUTH-EVENTS
  version: 1.0.0
spec:
  title: 'Log every authentication attempt'
  description: 'Log successful and failed login attempts (with timestamp, source IP, and account, but not the password) to a retained log store, and feed it into alerting for brute-force/credential-stuffing patterns.'
  cost: low
  effort: low
  effectiveness: medium
  category: detective
