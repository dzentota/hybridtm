apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SEGMENT-TRUST-BOUNDARIES
  version: 1.0.0
spec:
  title: 'Split internet-facing and data-storing components into separate boundaries'
  description: 'Move the internet-reachable component into its own boundary (e.g. a DMZ) separate from datastores and other internal components, so compromising it does not grant network-level proximity to sensitive data.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
