apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-REQUEST-VALIDATION
  version: 1.0.0
spec:
  title: 'Validate requests against a schema at the gateway'
  description: 'Attach a request model/schema (e.g. JSON Schema, OpenAPI-derived validation) to the gateway so malformed requests are rejected before reaching the backend.'
  cost: low
  effort: medium
  effectiveness: medium
  category: preventive
