apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-TOKENIZE-CARD-DATA
  version: 1.0.0
spec:
  title: 'Use the payment provider''s tokenization instead of raw card data'
  description: 'Collect card data directly into the payment provider''s hosted field/SDK and store only the returned token, so raw PAN/CVV never touches your own systems.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
