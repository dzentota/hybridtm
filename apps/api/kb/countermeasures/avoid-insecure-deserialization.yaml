apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-AVOID-INSECURE-DESERIALIZATION
  version: 1.0.0
spec:
  title: 'Use a data-only serialization format for untrusted input'
  description: 'Deserialize untrusted input with a format that cannot reconstruct arbitrary objects (JSON with a strict schema) instead of native object serialization, and if native serialization must be used, sign and verify the payload first.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
