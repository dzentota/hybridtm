apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-REGENERATE-SESSION-ID
  version: 1.0.0
spec:
  title: 'Regenerate the session ID on login and privilege change'
  description: 'Issue a fresh session identifier immediately after successful authentication (and after any other privilege escalation), invalidating the pre-login session.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
