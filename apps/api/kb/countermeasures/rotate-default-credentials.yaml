apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ROTATE-DEFAULT-CREDENTIALS
  version: 1.0.0
spec:
  title: 'Rotate default credentials on first boot'
  description: 'Force a credential change on first login and disable the vendor default account once a replacement administrator exists.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
  applies_property: { id: default_admin_credentials_changed, value: true }
