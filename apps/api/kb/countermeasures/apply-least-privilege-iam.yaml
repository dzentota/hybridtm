metadata:
  id: CM-APPLY-LEAST-PRIVILEGE-IAM
  version: 1.0.0
spec:
  title: 'Scope the execution role to exactly what it calls'
  description: 'Generate the policy from actual usage (e.g. IAM Access Analyzer policy generation) and grant only the specific actions and resource ARNs the function/service calls, reviewing and re-scoping as its behavior changes.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
