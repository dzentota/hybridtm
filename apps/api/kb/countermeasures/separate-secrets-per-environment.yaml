apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SEPARATE-SECRETS-PER-ENVIRONMENT
  version: 1.0.0
spec:
  title: 'Use distinct secrets per environment'
  description: 'Issue separate credentials for production, staging, and development, stored in separate secrets-manager namespaces/mounts, so a lower-security environment compromise cannot be replayed against production.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
