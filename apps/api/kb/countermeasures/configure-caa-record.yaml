kind: Countermeasure
metadata:
  id: CM-CONFIGURE-CAA-RECORD
  version: 1.0.0
spec:
  title: 'Publish a CAA record restricting certificate issuance'
  description: 'Add a CAA DNS record naming only the certificate authorities actually used, so any other CA is instructed to refuse issuance for this domain.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
