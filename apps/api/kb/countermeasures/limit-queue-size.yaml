kind: Countermeasure
metadata:
  id: CM-LIMIT-QUEUE-SIZE
  version: 1.0.0
spec:
  title: 'Bound queue length and enable backpressure'
  description: 'Set a maximum queue length or memory limit and reject or shed load once it is reached, rather than letting the broker grow unbounded until it runs out of resources.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
