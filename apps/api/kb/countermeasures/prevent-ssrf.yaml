apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-PREVENT-SSRF
  version: 1.0.0
spec:
  title: 'Allow-list outbound destinations and block metadata endpoints'
  description: 'Validate user-influenced URLs against an allow-list of expected hosts/schemes, resolve and check the destination IP against private/link-local ranges before connecting, and block the cloud provider''s instance metadata address explicitly.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
