apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-USE-SECRETS-MANAGER-FOR-ENV
  version: 1.0.0
spec:
  title: 'Fetch secrets from a secrets manager at runtime'
  description: 'Store credentials in a secrets manager and grant the execution role permission to fetch them at runtime, rather than baking them into plaintext environment variables.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
