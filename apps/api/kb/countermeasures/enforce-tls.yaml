apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENFORCE-TLS
  version: 1.0.0
spec:
  title: 'Enforce TLS 1.2+ for all boundary-crossing traffic'
  description: 'Require an encrypted protocol variant on every communication link that crosses a trust boundary, and disable TLS versions below 1.2.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
