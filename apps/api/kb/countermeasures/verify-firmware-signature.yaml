apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-VERIFY-FIRMWARE-SIGNATURE
  version: 1.0.0
spec:
  title: 'Verify firmware signatures before installing updates'
  description: 'Sign firmware images with a manufacturer key and have the device verify the signature (ideally via a hardware root of trust / secure boot) before flashing any update.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
