apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-RUN-AS-NON-ROOT
  version: 1.0.0
spec:
  title: 'Run the process as a dedicated unprivileged user'
  description: 'Set the container/function to run as a non-root UID (and set `runAsNonRoot`/equivalent where the platform enforces it), so a code-execution bug does not hand the attacker root inside the sandbox.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
