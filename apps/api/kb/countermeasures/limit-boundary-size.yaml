apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-LIMIT-BOUNDARY-SIZE
  version: 1.0.0
spec:
  title: 'Split large trust boundaries into smaller ones'
  description: 'Break an oversized trust boundary into several smaller ones along natural component groupings (e.g. by service or data sensitivity), each with its own network-level enforcement, to limit how far a single compromise can reach.'
  cost: medium
  effort: high
  effectiveness: medium
  category: preventive
