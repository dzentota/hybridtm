apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SECURE-SESSION-COOKIES
  version: 1.0.0
spec:
  title: 'Set Secure and HttpOnly on session cookies'
  description: 'Mark the session cookie Secure (HTTPS only), HttpOnly (no script access), and SameSite=Lax/Strict.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
  applies_property: { id: session_cookie_secure, value: true }
