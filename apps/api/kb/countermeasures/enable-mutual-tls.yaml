apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-MUTUAL-TLS
  version: 1.0.0
spec:
  title: 'Require mutual TLS between internal services'
  description: 'Issue client certificates (directly, or via a service mesh''s automatic mTLS) so each side of an internal service-to-service link authenticates the other, not just encrypts the channel.'
  cost: medium
  effort: high
  effectiveness: high
  category: preventive
