apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-MINIMIZE-WRITE-ACCESS
  version: 1.0.0
spec:
  title: 'Mark read-only flows as read-only and enforce it'
  description: 'Where a caller only needs to read data, grant a read-only credential/scope and mark the modeled flow as read-only, so a compromise of that caller cannot be used to modify the data.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
