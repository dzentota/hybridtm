apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENCRYPT-BACKUPS
  version: 1.0.0
spec:
  title: 'Encrypt backups at rest'
  description: 'Enable encryption on the backup storage/snapshot mechanism, using a key separate from (or with stricter access than) the one protecting the live datastore.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
