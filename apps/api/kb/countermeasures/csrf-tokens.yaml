apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-CSRF-TOKENS
  version: 1.0.0
spec:
  title: 'Use per-session CSRF tokens'
  description: 'Generate a per-session anti-CSRF token, embed it in state-changing forms/requests, and reject requests where it is missing or invalid.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
  applies_property: { id: csrf_protection_enabled, value: true }
