apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-EXTERNALIZE-SECRETS
  version: 1.0.0
spec:
  title: 'Externalize credentials to configuration or a secrets manager'
  description: 'Move hardcoded credentials out of source code into environment configuration or a secrets manager, then rotate every credential that was ever committed since removing it from the latest commit does not invalidate it.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
