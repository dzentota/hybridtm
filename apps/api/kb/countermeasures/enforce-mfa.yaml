apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENFORCE-MFA
  version: 1.0.0
spec:
  title: 'Enforce multi-factor authentication'
  description: 'Require a second factor (TOTP, WebAuthn, or push) for all users, at minimum for administrative accounts.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
  applies_property: { id: mfa_enforced, value: true }
