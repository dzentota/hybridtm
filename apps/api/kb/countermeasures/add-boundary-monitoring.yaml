apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ADD-BOUNDARY-MONITORING
  version: 1.0.0
spec:
  title: 'Add an observability collector inside the boundary'
  description: 'Ship logs/metrics from every component in this trust boundary to an observability collector (in-boundary or centrally, over an authenticated encrypted channel), so activity inside it is actually visible.'
  cost: medium
  effort: medium
  effectiveness: medium
  category: detective
