apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SET-COOKIE-SAMESITE
  version: 1.0.0
spec:
  title: 'Set SameSite=Lax or Strict on session cookies'
  description: 'Set the session cookie''s SameSite attribute to Lax (or Strict where the login flow allows it) so browsers withhold it from cross-site requests.'
  cost: low
  effort: low
  effectiveness: medium
  category: preventive
