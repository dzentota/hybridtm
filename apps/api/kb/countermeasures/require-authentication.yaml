metadata:
  id: CM-REQUIRE-AUTHENTICATION
  version: 1.0.0
spec:
  title: 'Require authentication before processing requests'
  description: 'Add an authentication check (session, token, or mTLS) in front of the endpoint and reject unauthenticated requests before any business logic runs.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
