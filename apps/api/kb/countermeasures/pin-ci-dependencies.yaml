apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-PIN-CI-DEPENDENCIES
  version: 1.0.0
spec:
  title: 'Pin CI dependencies to immutable digests'
  description: 'Reference third-party actions and base images by content digest (e.g. `uses: org/action@<sha>`) instead of a mutable tag or branch, and update the pin deliberately via a reviewed PR rather than automatically.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
