apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-HSTS
  version: 1.0.0
spec:
  title: 'Send Strict-Transport-Security'
  description: 'Configure the TLS-terminating component to send a Strict-Transport-Security header with a long max-age, forcing browsers to use HTTPS on every subsequent request.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
  applies_property: { id: encryption_at_rest, value: false }
