apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-RESTRICT-CORS-ORIGIN
  version: 1.0.0
spec:
  title: 'Restrict CORS to an explicit origin allow-list'
  description: 'Set Access-Control-Allow-Origin to a specific, explicitly allow-listed origin (or a small set of them) instead of `*` or an unconditionally reflected request origin, and avoid combining a wildcard origin with Allow-Credentials.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
