apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-AUTO-UPDATE
  version: 1.0.0
spec:
  title: 'Ship an automatic update mechanism'
  description: 'Add auto-update (app store managed updates, or an in-app updater with signature verification) so security fixes reach installed clients without relying on users to update manually.'
