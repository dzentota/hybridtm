metadata:
  id: CM-NETWORK-SEGMENTATION
  version: 1.0.0
spec:
  title: 'Segment datastores behind an application tier'
  description: 'Remove any direct network path from internet-facing components to datastores; route all data access through an authenticated application/API layer.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
