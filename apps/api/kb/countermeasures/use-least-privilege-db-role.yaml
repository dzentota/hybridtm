apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-USE-LEAST-PRIVILEGE-DB-ROLE
  version: 1.0.0
spec:
  title: 'Create a scoped database role for the application'
  description: 'Create a dedicated database role granting only the specific tables/operations the application needs (e.g. no DDL, no access to other applications'' schemas), instead of connecting as an administrative account.'
  cost: low
  effort: medium
  effectiveness: high
  category: preventive
