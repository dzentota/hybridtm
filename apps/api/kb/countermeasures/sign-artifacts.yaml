apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-SIGN-ARTIFACTS
  version: 1.0.0
spec:
  title: 'Sign artifacts and verify signatures on pull'
  description: 'Sign images/packages at build time (e.g. Sigstore Cosign) and configure consumers (deployment pipeline, admission controller) to reject anything without a valid signature from the expected identity.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
