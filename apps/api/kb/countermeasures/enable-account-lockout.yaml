apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ENABLE-ACCOUNT-LOCKOUT
  version: 1.0.0
spec:
  title: 'Rate-limit or lock out accounts after failed logins'
  description: 'Enable progressive delays or temporary lockout after a small number of consecutive failed login attempts per account, and alert on sustained brute-force patterns.'
  cost: low
  effort: low
  effectiveness: high
  category: preventive
