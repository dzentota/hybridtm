apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-ISOLATE-PCI-SCOPE
  version: 1.0.0
spec:
  title: 'Isolate payment processing into a minimal PCI DSS scope'
  description: 'Put the component(s) that talk to the payment provider in their own trust boundary, segmented from the rest of the environment, so PCI DSS scope — and the blast radius of a compromise — stays as small as possible.'
  cost: medium
  effort: high
  effectiveness: high
  category: preventive
