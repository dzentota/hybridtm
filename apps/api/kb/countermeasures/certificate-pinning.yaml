apiVersion: hybridtm.io/kb/v1
kind: Countermeasure
metadata:
  id: CM-CERTIFICATE-PINNING
  version: 1.0.0
spec:
  title: 'Pin the backend certificate or public key in the mobile client'
  description: 'Embed the expected certificate or public key hash in the app and reject connections that present anything else, even if publicly CA-signed.'
  cost: medium
  effort: medium
  effectiveness: high
  category: preventive
  applies_property: { id: certificate_pinning_enabled, value: true }
