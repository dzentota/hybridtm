apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-OBJECT-STORAGE-NO-ACCESS-LOGGING
  version: 1.0.0
spec:
  title: 'Object storage access is not logged'
  summary: 'Reads and writes to the bucket/container are not logged, so an unauthorized access or exfiltration event leaves no trail to investigate after the fact.'
  stride: [repudiation]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [778]
  countermeasures:
      - CM-ENABLE-OBJECT-ACCESS-LOGGING
