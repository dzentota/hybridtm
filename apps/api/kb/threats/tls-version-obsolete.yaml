apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-TLS-VERSION-OBSOLETE
  version: 1.0.0
spec:
  title: 'Component permits obsolete TLS protocol versions'
  summary: 'The component still accepts TLS 1.0/1.1, both deprecated for known cryptographic weaknesses (e.g. BEAST, POODLE-adjacent issues) and disallowed by PCI DSS since mid-2018.'
  stride: [tampering, information-disclosure]
  base:
    likelihood: unlikely
    impact: medium
  standards:
      cwe: [327, 326]
      owasp_asvs: ['V9.1.3']
      pci_dss_4: ['4.2.1']
  countermeasures:
      - CM-ENFORCE-TLS
