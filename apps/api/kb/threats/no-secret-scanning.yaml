apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-NO-SECRET-SCANNING
  version: 1.0.0
spec:
  title: 'CI/CD pipeline does not scan source code for committed secrets'
  summary: 'Nothing checks commits for accidentally-committed credentials before they land in version control history, so a leaked secret can sit in the repository (and every clone/fork of it) indefinitely, long after anyone notices.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [540, 798]
  countermeasures:
      - CM-ENABLE-SECRET-SCANNING
