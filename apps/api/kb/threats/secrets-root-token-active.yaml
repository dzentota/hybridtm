apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-ROOT-TOKEN-ACTIVE
  version: 1.0.0
spec:
  title: 'Secrets store root token has not been revoked after initialization'
  summary: 'The initial root/superuser token created during setup is still active, giving anyone who obtains it unrestricted access to every secret in the store.'
  stride: [elevation-of-privilege]
  base:
    likelihood: likely
    impact: very-high
  standards:
      cwe: [250, 732]
  countermeasures:
      - CM-REVOKE-ROOT-TOKEN
