apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-NO-EXPIRATION
  version: 1.0.0
spec:
  title: 'Secrets are issued without a lease or expiration'
  summary: 'The secrets manager issues credentials with no time-to-live, so a service that no longer needs a secret (decommissioned, compromised, or simply forgotten) keeps a permanently valid credential outstanding.'
  stride: [elevation-of-privilege]
  base:
    likelihood: unlikely
    impact: medium
  standards:
      cwe: [613]
  countermeasures:
      - CM-ENFORCE-LEASE-TTL
