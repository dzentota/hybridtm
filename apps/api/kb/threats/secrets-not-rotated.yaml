apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-NOT-ROTATED
  version: 1.0.0
spec:
  title: 'Secrets are never rotated'
  summary: 'Credentials stored in the secrets manager are never automatically rotated, so a leaked secret remains valid indefinitely once it escapes, and there is no routine mechanism to limit how long any single credential is trusted.'
  stride: [elevation-of-privilege]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [798]
      pci_dss_4: ['3.6.1']
  countermeasures:
      - CM-ENABLE-SECRET-ROTATION
