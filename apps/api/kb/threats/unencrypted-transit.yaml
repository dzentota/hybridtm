apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-UNENCRYPTED-TRANSIT
  version: 1.0.0
spec:
  title: 'Data flow crosses a trust boundary without transport encryption'
  summary: 'A communication link that crosses a trust boundary uses a plaintext protocol, so anyone on the network path between the boundaries can read or modify the data.'
  stride: [information-disclosure, tampering]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [319]
  countermeasures:
      - CM-ENFORCE-TLS
