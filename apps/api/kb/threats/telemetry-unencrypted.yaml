apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-TELEMETRY-UNENCRYPTED
  version: 1.0.0
spec:
  title: 'Telemetry is collected without transport encryption'
  summary: 'Logs, metrics, or traces are sent to the collector over a plaintext protocol, so anyone on the network path can read operational data that often includes internal hostnames, request paths, and error detail.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [319]
  countermeasures:
      - CM-ENFORCE-TLS
