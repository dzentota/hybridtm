apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SENSITIVE-DATA-UNENCRYPTED-FLOW
  version: 1.0.0
spec:
  title: 'Confidential data flows over an unencrypted link'
  summary: 'A communication link known to carry confidential-or-higher data uses an unencrypted protocol, independent of whether it happens to cross a trust boundary — internal networks are not automatically trusted.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [319]
      pci_dss_4: ['4.2.1']
  countermeasures:
      - CM-ENFORCE-TLS
