apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-NO-RESOURCE-LIMITS
  version: 1.0.0
spec:
  title: 'Compute resource has no CPU/memory limits'
  summary: 'The function/container has no configured resource limits, so a runaway process (a bug, or an attacker-triggered resource-exhaustion input) can consume all available CPU/memory on its host, degrading or crashing every other workload sharing it.'
  stride: [denial-of-service]
  base:
    likelihood: unlikely
    impact: medium
  standards:
      cwe: [400]
  countermeasures:
      - CM-SET-RESOURCE-LIMITS
