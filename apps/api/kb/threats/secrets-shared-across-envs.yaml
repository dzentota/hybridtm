apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-SHARED-ACROSS-ENVS
  version: 1.0.0
spec:
  title: 'The same secrets are used across multiple environments'
  summary: 'Production and non-production environments (staging, dev) share the same credentials, so a compromise of a lower-security environment directly yields valid production access.'
  stride: [elevation-of-privilege]
  base:
    likelihood: unlikely
    impact: high
  standards:
      cwe: [798]
  countermeasures:
      - CM-SEPARATE-SECRETS-PER-ENVIRONMENT
