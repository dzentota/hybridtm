apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-HARDCODED-SECRETS
  version: 1.0.0
spec:
  title: 'Credentials are hardcoded in application source code'
  summary: 'API keys, passwords, or tokens are embedded directly in source code rather than externalized to configuration or a secrets manager, so they end up in version control history, build artifacts, and anywhere the source is shared — permanently, since removing a later commit does not erase the history.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [798]
  countermeasures:
      - CM-EXTERNALIZE-SECRETS
