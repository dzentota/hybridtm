apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-IN-ENV-VARS
  version: 1.0.0
spec:
  title: 'Secrets are stored as plaintext environment variables'
  summary: 'Credentials are set directly as function/task environment variables instead of being fetched from a secrets manager at runtime, so anyone with read access to the resource''s configuration (including via the provider console, API, or a misconfigured IaC state file) can read them in plaintext.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [798, 526]
  countermeasures:
      - CM-USE-SECRETS-MANAGER-FOR-ENV
