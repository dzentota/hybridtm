apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-EKS-CONTROL-PLANE-LOGGING-DISABLED
  version: 1.0.0
spec:
  title: 'Kubernetes control plane audit logging is disabled'
  summary: 'API server audit logs are not enabled, so there is no record of who called the Kubernetes API or what they did — a cluster-level compromise or privilege escalation leaves no trail to investigate.'
  stride: [repudiation]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [778]
      pci_dss_4: ['10.2.1']
  countermeasures:
      - CM-ENABLE-CONTROL-PLANE-LOGGING
