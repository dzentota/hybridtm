apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SECRETS-AUDIT-DISABLED
  version: 1.0.0
spec:
  title: 'Secrets store access is not audit-logged'
  summary: 'Reads and writes of secrets are not logged, so a compromise or insider misuse of stored credentials cannot be detected or investigated after the fact.'
  stride: [repudiation]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [778]
      pci_dss_4: ['10.2.1']
  countermeasures:
      - CM-ENABLE-AUDIT-LOGGING
