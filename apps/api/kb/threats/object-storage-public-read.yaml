apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-OBJECT-STORAGE-PUBLIC-READ
  version: 1.0.0
spec:
  title: 'Object storage bucket is publicly readable'
  summary: 'A blob storage bucket allows anonymous read access, exposing every object in it to anyone who can guess or enumerate the bucket name.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [284, 668]
  countermeasures:
      - CM-BLOCK-PUBLIC-BUCKET-ACCESS
