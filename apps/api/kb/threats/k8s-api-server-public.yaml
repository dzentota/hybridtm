apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-K8S-API-SERVER-PUBLIC
  version: 1.0.0
spec:
  title: 'Kubernetes API server endpoint is publicly reachable with no IP restriction'
  summary: 'The cluster''s control-plane endpoint accepts connections from any source IP, so the entire attack surface of the Kubernetes API — authentication bypass bugs, credential stuffing against it — is exposed to the whole internet instead of a known set of networks.'
  stride: [elevation-of-privilege]
  base:
    likelihood: unlikely
    impact: high
  standards:
      cwe: [284]
      pci_dss_4: ['1.3.1']
  countermeasures:
      - CM-RESTRICT-K8S-API-ACCESS
