apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-BOUNDARY-NO-MONITORING
  version: 1.0.0
spec:
  title: 'Trust boundary has no observability collector monitoring it'
  summary: 'None of the components inside this trust boundary send telemetry to any modeled observability collector, so activity inside the boundary — including an active compromise — has no logging or metrics trail to detect it by.'
  stride: [repudiation]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [778]
      pci_dss_4: ['10.4.1']
  countermeasures:
      - CM-ADD-BOUNDARY-MONITORING
