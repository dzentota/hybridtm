apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-WEAK-PASSWORD-POLICY
  version: 1.0.0
spec:
  title: 'Identity provider does not enforce a minimum password policy'
  summary: 'The identity provider accepts weak or previously-breached passwords, making credential guessing and stuffing attacks significantly more likely to succeed.'
  stride: [spoofing]
  base:
    likelihood: likely
    impact: medium
  standards:
      cwe: [521]
      pci_dss_4: ['8.3.6']
  countermeasures:
      - CM-ENFORCE-PASSWORD-POLICY
