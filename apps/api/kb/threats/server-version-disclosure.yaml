apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-SERVER-VERSION-DISCLOSURE
  version: 1.0.0
spec:
  title: 'Server banner discloses software version'
  summary: "The component's default response headers or error pages disclose exact server/software version, letting an attacker target version-specific known vulnerabilities."
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: low
  standards:
      cwe: [200, 497]
      pci_dss_4: ['2.2.1']
  countermeasures:
      - CM-DISABLE-VERSION-DISCLOSURE
