apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-INSECURE-LOCAL-SECRET-STORAGE
  version: 1.0.0
spec:
  title: 'Client stores secrets outside the platform secure storage'
  summary: 'Tokens or credentials are kept in plain local storage, shared preferences, or an unencrypted file instead of the platform keychain/keystore, so any other process or a stolen backup can read them directly.'
  stride: [information-disclosure]
  base:
    likelihood: likely
    impact: high
  standards:
      cwe: [312, 522]
  countermeasures:
      - CM-SECURE-LOCAL-STORAGE
