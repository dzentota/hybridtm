apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-CARD-DATA-NOT-TOKENIZED
  version: 1.0.0
spec:
  title: 'Raw card data is handled instead of a provider token'
  summary: 'The integration passes or stores raw cardholder data rather than the payment provider''s tokenized reference, so every system that touches it falls into full PCI DSS scope and becomes a target for card-data theft.'
  stride: [information-disclosure]
  base:
    likelihood: unlikely
    impact: very-high
  standards:
      cwe: [311]
      pci_dss_4: ['3.5.1']
  countermeasures:
      - CM-TOKENIZE-CARD-DATA
