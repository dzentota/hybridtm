apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-KMS-KEY-ROTATION-DISABLED
  version: 1.0.0
spec:
  title: 'Encryption key is never rotated'
  summary: 'The key management service is not configured to rotate the key material automatically, so the same key protects data indefinitely, and a key compromise (or a future cryptographic weakness) affects every piece of data ever encrypted with it.'
  stride: [information-disclosure]
  base:
    likelihood: unlikely
    impact: medium
  standards:
      cwe: [320]
  countermeasures:
      - CM-ENABLE-KEY-ROTATION
