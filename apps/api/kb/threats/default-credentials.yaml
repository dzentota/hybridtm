apiVersion: hybridtm.io/kb/v1
kind: Threat
metadata:
  id: THREAT-DEFAULT-CREDENTIALS
  version: 1.0.0
spec:
  title: 'Default administrative credentials have not been changed'
  summary: 'The component still uses its vendor-supplied default username/password, which is publicly documented and routinely scanned for by attackers.'
  stride: [spoofing, elevation-of-privilege]
  base:
    likelihood: frequent
    impact: very-high
  standards:
      cwe: [1392, 798]
      capec: [70]
      owasp_asvs: ['V2.10.2']
      pci_dss_4: ['2.2.1']
  countermeasures:
      - CM-ROTATE-DEFAULT-CREDENTIALS
