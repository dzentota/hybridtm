services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hybridtm
      POSTGRES_USER: hybridtm
      POSTGRES_PASSWORD: hybridtm
    ports:
      - "5432:5432"
    volumes:
      - hybridtm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hybridtm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hybridtm_postgres_data:
